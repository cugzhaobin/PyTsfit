dict_input:
    eqfile           : './eq_rename'
    prior_velfile    : ''
    prior_offsetfile : ''
    prior_periodfile : ''
    sitefile         : 'cmonoc.cmnc'
    timespan         : [1998, 2024]
    tsdir            : '../pos/'
    tsformat         : 'pos'
dict_param:
    constant    : True
    linear      : True
    annual      : True
    semiannual  : True
    break       : True
    eqoffset_ne : True
    eqoffset_up : True
    eqpost_ne   : False
    eqpost_up   : False
dict_plot:
    detrend    : True
    debreak    : True
    deeqoffset : False
    depost     : False
    deseason   : False
    showfig    : False
    figformat  : 'jpg'
dict_fit:
    sigma_scale    : 'nrms'      # none | nrms | realistic
    min_rsig       : 30          # minimum used points for realistic sigma
    min_sigscale   : 10          # minimum dof below which sig_scale = 1
    outlier        : False       # enable iterative outlier editing
    nsigma         : 4.0
    outlier_scale  : 'mad'       # mad | sigma
    max_iter       : 10
    restore_factor : 0.9
    max_sigma      : 0.0         # pre-fit sigma screen (mm); 0 = off
dict_output:
    tsfig       : False
    param       : False
    obsmod      : False
    eqpostts    : False
    velfile     : ''
    eqoffset    : ''
    break       : ''
    # Cumulative-displacement windows. `eqpostdsp_tspan` may be one [t0, t1]
    # pair or a list of pairs; entries are paired positionally with
    # `eqpostdisp`. The older key `eqpost_tspan` is still accepted as an
    # alias when `eqpostdsp_tspan` is absent.
    eqpostdisp     : ''          # e.g. ['postseismic1.gmtvec', 'postseismic2.gmtvec']
    eqpostdsp_tspan: [2015, 2023]  # e.g. [[2015, 2020], [2020, 2023]]
    # Postseismic time-series window ({site}_pos.neu), independent of the
    # displacement windows above. It is the zero epoch of YEAR_SINCE_EQ and
    # is usually the earthquake origin time. Falls back to the displacement
    # window when not set.
    eqpostts_tspan : [2015, 2023]
